name: CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew --no-daemon clean test

      - name: Docker Build (no push)
        run: docker build -t local/agent:ci .


  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build & Test
        run: ./gradlew --no-daemon clean test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  kubernetes:
    runs-on: ubuntu-latest
    needs: build-test-docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@master

      - name: Verify cluster
        run: kubectl get nodes

      - name: Build Docker image inside Minikube
        run: |
          eval $(minikube -p minikube docker-env)
          docker build -t ai-agent:ci .

      - name: Deploy to Minikube
        run: kubectl apply -f src/main/k8s/ai-agent-deployment.yml

      - name: Wait for pod ready
        run: |
          kubectl wait --for=condition=Ready pod -l app=ai-agent --timeout=180s
          kubectl get pods -o wide
          kubectl get svc

      - name: Start port-forward
        run: |
          kubectl port-forward svc/ai-agent 8080:8080 > port-forward.log 2>&1 &
          echo $! > port-forward.pid
          sleep 10
          cat port-forward.log

      - name: Test service health endpoint
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 10
          max_attempts: 6
          command: curl -fsS http://127.0.0.1:8080/actuator/health

      - name: Log Kubernetes pods
        run: |
          kubectl logs -l app=ai-agent --tail=200

      - name: Log port-forward output
        if: always()
        run: |
          cat port-forward.log || true

      - name: Stop port-forward
        if: always()
        run: |
          kill $(cat port-forward.pid) || true

      - name: Log pods on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pod -l app=ai-agent
          kubectl logs -l app=ai-agent --tail=200